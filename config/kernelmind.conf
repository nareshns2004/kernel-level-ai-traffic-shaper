[core]
interface = "eth0"
mode = "monitor-only"
log_level = "debug"

[ai]
model_path = "/etc/kernelmind/models/default.kmmodel"
inference_threshold = 8
online_learning = false
update_interval_sec = 300

[shaping]
total_bandwidth_mbps = 100
min_flow_rate_kbps = 256
max_flow_rate_mbps = 90

[anomaly]
enabled = true
entropy_threshold = 0.90
auto_throttle = false
throttle_rate_kbps = 64
